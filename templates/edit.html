<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>
    <h1>Edit {{ employee.name }}</h1>
    <form action="" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Name" value="{{ employee.name }}" required>
        <input type="text" name="address" placeholder="Address" value="{{ employee.address }}" required>
        <input type="text" name="role" placeholder="Role" value="{{ employee.role }}">
        <input type="text" name="region" placeholder="Region" value="{{ employee.region }}">
        <input type="email" name="email" placeholder="Email" value="{{ employee.email }}">
        <input type="text" name="phone" placeholder="Phone" value="{{ employee.phone }}">
        <input type="file" name="photo">
        <button type="submit">Save</button>
    </form>
</body>
</html>
